apiVersion: apps/v1
kind: Deployment
metadata:
  name: ariba-crd-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ariba-crd-mcp-server
  template:
    metadata:
      labels:
        app: ariba-crd-mcp-server
    spec:
      containers:
      - name: ariba-crd-mcp-server
        image: ghcr.io/padminis-tech/skills:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ariba-crd-mcp-server
  namespace: default
spec:
  selector:
    app: ariba-crd-mcp-server
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: ariba-crd-mcp-server
  namespace: default
spec:
  hosts:
  - ariba-crd-mcp-server.c-55cc5d0.stage.kyma.ondemand.com
  service:
    name: ariba-crd-mcp-server
    port: 3000
  gateway: kyma-system/kyma-gateway
  rules:
  - path: /
    methods:
    - GET
    - POST
    - OPTIONS
    noAuth: true
